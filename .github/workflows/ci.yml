name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      # Acceptance checks (Milestone 1 steps 4/8) shell out to wasm-tools to
      # cross-check the emitted component with the same binary developers use.
      # Direct release download (pinned): taiki-e/install-action's own
      # archive hit codeload 429s on 4/5 runs of 2026-08-17.
      - name: install wasm-tools
        shell: bash
        run: |
          set -euo pipefail
          V=1.252.0
          case "$(uname -s)" in
            Darwin) TARGET=aarch64-macos ;;
            *) TARGET=x86_64-linux ;;
          esac
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/wasm-tools.tar.gz \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${V}/wasm-tools-${V}-${TARGET}.tar.gz"
          tar -xzf /tmp/wasm-tools.tar.gz -C /tmp
          install -m 0755 "/tmp/wasm-tools-${V}-${TARGET}/wasm-tools" /usr/local/bin/wasm-tools 2>/dev/null \
            || sudo install -m 0755 "/tmp/wasm-tools-${V}-${TARGET}/wasm-tools" /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      # M2 1:1 gate — código ⇔ regla ⇔ snapshot. Redundant with the full
      # suite above, but named so a gate breach is legible in the log. The
      # registry_spec leg reads the vendored spec in specs/ and runs here in
      # full since 2026-08-21 (before that it self-skipped in CI).
      - name: diagnostics 1:1 gate
        run: |
          cargo test -p clean-compiler-types --test registry --test registry_spec -- --nocapture
          cargo test -p clean-compiler --test emitted_codes --test diagnostics_fixtures -- --nocapture

  # Cross-OS build matrix cell required by foundation
  # "05 execution/automation/01-ci-per-component.md" (clean-compiler row:
  # ubuntu / macos / windows — build only, no test). ubuntu and macos
  # already build as part of `test` above; this fills the windows cell so
  # the first `v*` tag is not the first time the compiler compiles on
  # windows (release.yml ships windows-x64). Confirmed with foundation
  # 2026-08-20 (foundation @ 80f5e2e): implementation of existing spec,
  # not an ADR-0027 change — coverage jobs below are untouched, and fmt
  # stays ubuntu-only ("one canonical formatter run").
  build-windows:
    name: build windows (build only, no test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --workspace

  # ADR-0027 Tier 1, blocking since M9: the build FAILS below the 80% line
  # floor. Branch (75%) and mutation (60%) floors run in nightly.yml, where
  # the nightly toolchain and the long mutation runs live.
  # ADR-0027 (Accepted 2026-08-20) names this job and nightly.yml as the
  # ecosystem's REFERENCE implementation — new Tier 1/2 components copy
  # these jobs. Notify foundation before changing their numbers or shape.
  # baseline 87.73% line measured 2026-08-19 (local, macOS, suite at
  # e71104d; registry_spec ran only locally before 2026-08-21, so CI read
  # slightly lower) — target 80% line per ADR-0027 Tier 1. Ratchet: when a
  # live CI measurement lands above 80, raise --fail-under-lines to it.
  coverage:
    name: coverage (ADR-0027 Tier 1, blocking)
    runs-on: ubuntu-latest
    env:
      # M5 made wasmtime a production dependency, so every instrumented
      # test binary links it statically; with full DWARF the runner's
      # linker dies with SIGBUS (resource exhaustion). Line coverage needs
      # the llvm-cov mapping, not debuginfo.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      # Same exhaustion guard: the stock image ships ~10 GB of unrelated
      # toolchains; reclaim them before building multi-GB test binaries.
      - name: free runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: install cargo-llvm-cov and wasm-tools
        shell: bash
        run: |
          set -euo pipefail
          # 0.9.0: 0.6.x cannot find object files under the build-dir
          # layout newer cargo emits (seen locally on nightly 2026-08).
          CV=0.9.0
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/llvm-cov.tar.gz \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${CV}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/llvm-cov.tar.gz -C "$HOME/.cargo/bin"
          V=1.252.0
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/wasm-tools.tar.gz \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${V}/wasm-tools-${V}-x86_64-linux.tar.gz"
          tar -xzf /tmp/wasm-tools.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/wasm-tools-${V}-x86_64-linux/wasm-tools" /usr/local/bin/wasm-tools
          cargo llvm-cov --version && wasm-tools --version

      - name: line coverage (blocking, ADR-0027 Tier 1 floor)
        run: cargo llvm-cov --workspace --summary-only --fail-under-lines 80

      # M3 snapshot-drift gate — the per-chapter spec suite and the smoke
      # corpus classification must match their committed snapshots (insta
      # fails on any drift; regeneration is a deliberate local act).
      - name: spec snapshot-drift gate
        env:
          INSTA_UPDATE: "no"
        run: cargo test -p clean-compiler --test spec_suite --test corpus_smoke -- --nocapture
