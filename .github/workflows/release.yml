name: release

# Triggered by pushing a `v*` tag. Publishes one archive per platform plus a
# `.sha256` sidecar, matching the filename convention cln-install parses:
#   clean-compiler-<version>-<os>-<arch>.tar.gz[.sha256]
#
# Manager installs these into ~/.cln/versions/compiler/<version>/ and expects
# the binary inside to be named `clean-compiler` (same convention as
# clean-framework / clean-server releases).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            os: macos
            arch: arm64
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: build
        run: cargo build --release --target ${{ matrix.target }} -p clean-compiler-bin

      - name: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="clean-compiler-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/clean-compiler" "dist/${NAME}/clean-compiler"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          shasum -a 256 "dist/${NAME}.tar.gz" | awk '{print $1}' > "dist/${NAME}.tar.gz.sha256"

      - name: upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes "" 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" dist/*.tar.gz dist/*.sha256
