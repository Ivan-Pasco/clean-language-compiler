name: release

# Triggered by pushing a `v*` tag. Publishes one archive per target plus a
# `.sha256` sidecar (hex digest only), using the 4-target matrix and filename
# convention Manager's release-asset consumers expect
# (foundation `02 components/manager/automation.md` Release matrix;
# archive format per `05 execution/automation/02-release-workflows.md`:
# `.tar.gz` on unix targets, `.zip` on windows):
#   clean-compiler-<version>-<target>.tar.gz[.sha256]   (linux/macos)
#   clean-compiler-<version>-windows-x64.zip[.sha256]
#   targets: linux-x64, macos-x64, macos-arm64, windows-x64
#
# Manager installs an archive into ~/.cln/versions/compiler/<version>/ and
# expects the compiler binary inside to be named `clean-compiler` (`.exe` on
# windows). The language server ships in the same archive at the same version
# (CCMP-26): `clean-language-server` sits next to the compiler binary.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version-check:
    name: tag matches workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: compare tag to Cargo.toml
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match workspace version ${CARGO_VERSION} in Cargo.toml" >&2
            exit 1
          fi

  build:
    name: build ${{ matrix.target_name }}
    needs: version-check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target_name: linux-x64
            target: x86_64-unknown-linux-gnu
            bin_ext: ""
            archive_ext: "tar.gz"
          - runner: macos-14
            target_name: macos-x64
            target: x86_64-apple-darwin
            bin_ext: ""
            archive_ext: "tar.gz"
          - runner: macos-14
            target_name: macos-arm64
            target: aarch64-apple-darwin
            bin_ext: ""
            archive_ext: "tar.gz"
          - runner: windows-latest
            target_name: windows-x64
            target: x86_64-pc-windows-msvc
            bin_ext: ".exe"
            archive_ext: "zip"
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: build
        run: cargo build --release --target ${{ matrix.target }} -p clean-compiler-bin -p clean-language-server

      - name: package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="clean-compiler-${VERSION}-${{ matrix.target_name }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/clean-compiler${{ matrix.bin_ext }}" "dist/${NAME}/"
          cp "target/${{ matrix.target }}/release/clean-language-server${{ matrix.bin_ext }}" "dist/${NAME}/"
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            (cd dist && 7z a -tzip "${NAME}.zip" "${NAME}" > /dev/null)
          else
            tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          fi
          ARCHIVE="dist/${NAME}.${{ matrix.archive_ext }}"
          openssl dgst -sha256 "${ARCHIVE}" | awk '{print $NF}' > "${ARCHIVE}.sha256"

      - name: upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --generate-notes seeds the body with GitHub's commit-based draft;
          # deliberate prose (CCMP-24 emitted-bytes callouts) is edited in
          # afterwards with `gh release edit`.
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" dist/*.${{ matrix.archive_ext }} dist/*.sha256
